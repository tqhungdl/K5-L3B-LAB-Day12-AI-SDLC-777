<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quán Ăn Chợ Nổi</title>
  <style>
    :root {
      color-scheme: light;
      background: #f5f1e6;
      color: #172d27;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      line-height: 1.4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    [hidden] {
      display: none !important;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 20px 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #deddd0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #185145;
      color: #fff6d8;
      font-size: 22px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 4px 12px;
      border-radius: 999px;
      background: #e8efe4;
      color: #1f4f42;
      font-weight: 700;
      font-size: 18px;
    }

    .quan .pill {
      background: #f2e2d2;
      color: #7a4122;
    }

    .shop .pill {
      background: #ece3f6;
      color: #56327a;
    }

    .fps-tag {
      font-size: 18px;
      color: #4d6258;
      font-variant-numeric: tabular-nums;
    }

    button {
      cursor: pointer;
      color: inherit;
      font: 700 18px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
      border: 2px solid #cfd4c4;
      border-radius: 10px;
      background: #fffdf6;
      padding: 8px 16px;
    }

    button:hover:not(:disabled) {
      background: #eceee2;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button.primary {
      background: #1a5b4c;
      color: #fffaf0;
      border-color: #14493d;
    }

    button.primary:hover:not(:disabled) {
      background: #226f5d;
    }

    button.warn {
      background: #a8493b;
      color: #fffaf0;
      border-color: #88372b;
    }

    button:focus-visible {
      outline: 3px solid #b7613e;
      outline-offset: 2px;
    }

    .hud-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 10px;
      margin: 10px 0;
    }

    .stat {
      background: #fffdf6;
      border: 2px solid #dfe1d2;
      border-radius: 12px;
      padding: 6px 14px;
      min-width: 132px;
      flex: 1 1 132px;
    }

    .stat span {
      display: block;
      color: #4d6056;
      font-size: 18px;
      font-weight: 600;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
    }

    .stat.danger {
      border-color: #c83e37;
      background: #fff0ee;
      color: #9c1f1a;
    }

    .stat.blink {
      animation: pulse 0.65s infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 1;
      }

      to {
        opacity: .52;
      }
    }

    .stat meter {
      display: block;
      width: 100%;
      height: 10px;
      margin-top: 4px;
    }

    .stat .hearts {
      color: #b93c46;
      letter-spacing: .08em;
    }

    .board {
      display: grid;
      grid-template: "scene panel" "controls controls" / minmax(0, 1fr) 370px;
      gap: 12px 16px;
    }

    .scene {
      grid-area: scene;
      position: relative;
      isolation: isolate;
      height: 495px;
      background: #143c3b;
      overflow: hidden;
      border-radius: 16px;
      border: 4px solid #284b47;
      box-shadow: 0 8px 22px #1c342b24;
      transition: border-color .15s, box-shadow .15s;
    }

    .scene.monster-alert {
      border-color: #9b30ff;
      box-shadow: 0 0 0 4px #9b30ff66, inset 0 0 28px #7b1fa2aa;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .scene-badges {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      color: #fff8df;
      background: #133631e8;
      border: 1px solid #f1fff352;
    }

    .badge.alert-monster {
      background: #6a1b9af0;
      border-color: #e1bee7;
      animation: pulse .55s infinite alternate;
    }

    .badge.alert-oxy {
      background: #b71c1cf0;
      border-color: #ffcdd2;
      animation: pulse .5s infinite alternate;
    }

    .scene-bottom {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0d2224c8;
      backdrop-filter: blur(6px);
    }

    .card {
      width: min(640px, 100%);
      max-height: 100%;
      overflow-y: auto;
      background: #fffdf7;
      color: #172d27;
      border: 2px solid #d7d9c9;
      border-radius: 16px;
      padding: 22px 26px;
      box-shadow: 0 18px 40px #0000004a;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.2;
    }

    .card p {
      margin: 6px 0 12px;
      font-size: 18px;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .kv-list {
      list-style: none;
      margin: 10px 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    .kv-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #f3f1e7;
      font-size: 18px;
    }

    .shop-grid {
      display: grid;
      gap: 10px;
      margin: 12px 0;
    }

    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid #dcded0;
      background: #faf8f0;
    }

    .shop-item strong {
      display: block;
      font-size: 20px;
    }

    .shop-item small {
      display: block;
      font-size: 18px;
      color: #4d6056;
    }

    aside {
      grid-area: panel;
      background: #fffdf6;
      border: 2px solid #dfe1d2;
      border-radius: 16px;
      padding: 14px 16px;
      min-width: 0;
      height: 495px;
      overflow-y: auto;
    }

    aside h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .count {
      background: #e6eee2;
      color: #1e5043;
      padding: 2px 10px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin: 10px 0;
    }

    .slot {
      height: 20px;
      border-radius: 5px;
      background: #ecefe6;
      border: 1px solid #d9dfd1;
    }

    .slot.full {
      background: var(--item);
      border-color: transparent;
    }

    .ingredients {
      list-style: none;
      margin: 6px 0;
      padding: 0;
      display: grid;
      gap: 4px;
    }

    .ingredients li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
    }

    .ingredients strong {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }

    .ingredient-dot {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      border-radius: 50%;
      background: var(--item);
    }

    .done-item {
      color: #246b45;
      font-weight: 700;
    }

    .order {
      margin: 6px 0;
      padding: 8px 10px;
      border-radius: 10px;
      background: #f5ebd9;
      border: 2px solid #e7d4b5;
      font-size: 18px;
    }

    .order.low-patience {
      background: #ffebee;
      border-color: #c62828;
      color: #8e1717;
    }

    .order small {
      display: block;
      font-size: 18px;
      font-weight: 600;
    }

    .order strong {
      display: block;
      font-size: 19px;
    }

    .detail {
      padding: 4px 0;
      border-bottom: 1px solid #eceee3;
      font-size: 18px;
    }

    .detail small {
      display: block;
      color: #4d6056;
      font-size: 18px;
    }

    .section-title {
      margin: 10px 0 4px;
      padding-top: 8px;
      border-top: 2px solid #e6e8dc;
      font-size: 18px;
      font-weight: 800;
    }

    .muted {
      color: #54665b;
      font-size: 18px;
      margin: 4px 0;
    }

    .controls {
      grid-area: controls;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      align-items: center;
      font-size: 18px;
      color: #3d5146;
    }

    kbd {
      display: inline-block;
      border: 1px solid #c9cebe;
      border-bottom-width: 2px;
      background: #fffdf6;
      padding: 1px 8px;
      border-radius: 6px;
      margin-right: 4px;
      font: 700 18px/1.3 system-ui, sans-serif;
      color: #1d352d;
    }

    .slot.spoiled-item {
      border: 2px dashed #d14949 !important;
      opacity: 0.6;
    }
    .spoiled-badge {
      display: inline-block;
      background: #fde8e8;
      color: #b01a1a;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      margin-left: 6px;
    }
    .fresh-tag {
      font-size: 13px;
      color: #4d6258;
      margin-left: 4px;
    }

    @media (max-width: 1020px) {
      .board {
        grid-template: "scene" "panel" "controls" / minmax(0, 1fr);
      }

      aside {
        height: auto;
        max-height: 360px;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">≋</span>
        <span>Quán Ăn Chợ Nổi</span>
        <span class="pill" id="phase-pill">Buổi sáng</span>
      </div>
      <div class="top-actions">
        <span class="fps-tag" id="fps-tag">60 FPS</span>
        <button type="button" id="btn-pause">Tạm dừng (P)</button>
        <button type="button" class="restart" id="btn-restart">↻ Chơi lại</button>
      </div>
    </header>

    <section class="hud-bar" id="stats" aria-label="Thông số HUD"></section>

    <div class="board">
      <section class="scene" id="scene" aria-label="Khu vực chơi">
        <canvas id="c"></canvas>

        <div class="scene-badges">
          <div class="badge" id="location">Sông Chín Khúc</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
            <div class="badge alert-monster" id="badge-monster" hidden>Thủy quái!</div>
            <div class="badge alert-oxy" id="badge-oxy" hidden>Hết hơi!</div>
          </div>
        </div>

        <div class="scene-bottom">
          <div class="badge" id="notice" role="status">Đang kết nối…</div>
          <div class="badge" id="prompt-hint" hidden></div>
        </div>

        <!-- Overlay toàn màn cho Menu / Intro / DayResult / Shop / Summary / Pause / End -->
        <div class="overlay" id="overlay" hidden>
          <div class="card" id="overlay-card"></div>
        </div>
      </section>

      <aside id="panel" aria-label="Chi tiết lượt chơi"></aside>

      <footer class="controls" aria-label="Điều khiển">
        <span><kbd>WASD</kbd><kbd>↑↓←→</kbd> Di chuyển</span>
        <span><kbd>E</kbd> <span id="action-label">Hái / cập bến</span></span>
        <span id="catch-control"><kbd>Space</kbd> Bắt cá</span>
        <span><kbd>Esc</kbd>/<kbd>P</kbd> Tạm dừng</span>
        <span><kbd>R</kbd> Chơi lại</span>
      </footer>
    </div>
  </main>

  <script>
    "use strict";
    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d");
    const el = (id) => document.getElementById(id);

    const INGREDIENTS = {
      ca_loc: { name: "Cá lóc", color: "#6f9658" },
      ca_linh: { name: "Cá linh", color: "#76a8b8" },
      ca_keo: { name: "Cá kèo", color: "#c98b49" },
      bong_dien_dien: { name: "Bông điên điển", color: "#e3b336" },
      bong_sung: { name: "Bông súng", color: "#d47392" },
      keo_neo: { name: "Kèo nèo", color: "#63b365" },
    };
    const DISH_NAMES = {
      ca_loc_nuong_trui: "Cá lóc nướng trui",
      goi_bong_sung: "Gỏi bông súng",
      lau_ca_linh_dien_dien: "Lẩu cá linh bông điên điển",
      canh_chua_ca_loc: "Canh chua cá lóc bông điên điển",
      ca_keo_nuong: "Cá kèo nướng muối ớt",
      lau_mam: "Lẩu mắm miền Tây",
    };
    const DISH_RECIPES = {
      ca_loc_nuong_trui: { ca_loc: 1 },
      goi_bong_sung: { bong_sung: 2 },
      lau_ca_linh_dien_dien: { ca_linh: 3, bong_dien_dien: 1 },
      canh_chua_ca_loc: { ca_loc: 1, bong_dien_dien: 1 },
      ca_keo_nuong: { ca_keo: 2 },
      lau_mam: { ca_linh: 2, ca_keo: 1, keo_neo: 1, bong_dien_dien: 1 },
    };
    const DEFAULT_SHOP_UPGRADES = {
      oxygen: [
        { level: 1, price: 200, oxygen_max_s: 45 },
        { level: 2, price: 400, oxygen_max_s: 60 },
      ],
      hp: [
        { level: 1, price: 250, hp_max: 4 },
        { level: 2, price: 500, hp_max: 5 },
      ],
    };
    const STOVE_STATES = { idle: "Đang trống", cooking: "Đang nấu", ready: "Món đã chín" };
    const END_REASONS = {
      docked: "Đã cập bến",
      fainted: "Út Sen đã ngất",
      time: "Đã hết giờ",
      days_complete: "Hoàn thành 5 ngày ở chợ nổi!",
      error: "Lượt chơi gặp lỗi",
    };

    const ingredient = (k) => INGREDIENTS[k] || { name: k, color: "#8c968b" };
    const dishName = (id) => DISH_NAMES[id] || id;
    const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtTime = (ticks) => {
      const s = Math.max(0, Math.ceil((ticks || 0) / 60));
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    };

    let snap = null, offline = false, exited = false;
    let dayIntroTimer = null, dayIntroKey = "", dayIntroSent = false;
    const rendered = new Map();

    // ---------- Chế độ xem trước snapshot mẫu (?demo=...) để test UI độc lập ----------
    const demoScreen = new URLSearchParams(location.search).get("demo");
    function buildDemoSnapshot(screen) {
      const base = {
        tick: 120, sim_tick: 120, mode: "day", phase: screen === "quan" ? "quan" : screen === "shop" ? "shop" : "gather",
        phase_tick: 120, state: screen === "pause" ? "paused" : "playing",
        day: 3, time_left_ticks: 1500, money: 460, earned: 710, shift_earned: 290, reputation: 3.6, score: 1010,
        upgrades: { oxygen: 1, hp: 0 }, active_upgrades: { oxygen: 0, hp: 0 },
        day_plan: {
          dishes: { goi_bong_sung: 2, canh_chua_ca_loc: 2, ca_keo_nuong: 2 },
          ingredients: { bong_dien_dien: 2, bong_sung: 4, ca_keo: 4, ca_loc: 2 },
        },
        player: { pos: [58, 22], vel: [0, 0], heading_deg: 0, oxygen_ticks: 360, oxygen_max_ticks: 1800, hp: 2, hp_max: 3, zero_oxy_ticks: 0, invuln_ticks: 0, catch_cd_ticks: 0, at_surface: false },
        hold: [
          { id: "I1", kind: "ca_loc", fresh: 92.5 },
          { id: "I2", kind: "bong_sung", fresh: 88.0 },
          { id: "I3", kind: "bong_sung", fresh: 75.0 },
          { id: "I4", kind: "ca_keo", fresh: 30.0 },
          { id: "I5", kind: "ca_keo", fresh: 25.5 },
          { id: "I6", kind: "bong_dien_dien", fresh: 99.0 },
        ],
        hold_count: 6, hold_capacity: 12,
        nodes: [
          { id: "N1", kind: "bong_dien_dien", pos: [12, 0], ready: true, regrow_ticks: 0 },
          { id: "N3", kind: "bong_sung", pos: [44, 0], ready: true, regrow_ticks: 0 },
          { id: "N5", kind: "keo_neo", pos: [76, 0], ready: false, regrow_ticks: 420 },
        ],
        fish: [
          { id: "F1", kind: "ca_linh", pos: [20, 6], heading_deg: 15, age_ticks: 40 },
          { id: "F2", kind: "ca_loc", pos: [38, 13], heading_deg: 180, age_ticks: 80 },
          { id: "F3", kind: "ca_keo", pos: [70, 25], heading_deg: 0, age_ticks: 60 },
        ],
        monsters: [
          { id: "M1", kind: "ca_sau", pos: [62, 24], waypoints: [[60, 24], [64, 24]], target_idx: 1, state: "chase", state_ticks_left: 0, recoil_dir: null },
        ],
        stock: [
          { id: "I1", kind: "bong_dien_dien", fresh: 95.0 },
          { id: "I2", kind: "bong_sung", fresh: 80.0 },
          { id: "I3", kind: "ca_keo", fresh: 30.0 },
          { id: "I4", kind: "ca_keo", fresh: 28.0 },
          { id: "I5", kind: "ca_loc", fresh: 85.0 },
          { id: "I6", kind: "keo_neo", fresh: 90.0 },
        ],
        hand: { order_id: "C1", dish_id: "ca_keo_nuong", base_price: 70 },
        stoves: [
          { id: "B1", pos: [2, 8], state: "cooking", dish: { order_id: "C2", dish_id: "canh_chua_ca_loc", base_price: 90 }, cook_ticks_left: 240, ready_ticks: 0 },
          { id: "B2", pos: [5, 8], state: "ready", dish: { order_id: "C3", dish_id: "goi_bong_sung", base_price: 40 }, cook_ticks_left: 0, ready_ticks: 30 },
        ],
        tables: [
          { id: "T1", pos: [9, 2], customer_id: "C1" },
          { id: "T2", pos: [13, 2], customer_id: "C2" },
          { id: "T3", pos: [9, 6], customer_id: "C3" },
          { id: "T4", pos: [13, 6], customer_id: null },
        ],
        customers: [
          { id: "C1", table_id: "T1", dish_id: "ca_keo_nuong", state: "waiting", order_status: "assigned", patience_ticks_left: 720, reserved: {} },
          { id: "C2", table_id: "T2", dish_id: "canh_chua_ca_loc", state: "waiting", order_status: "assigned", patience_ticks_left: 2600, reserved: {} },
          { id: "C3", table_id: "T3", dish_id: "goi_bong_sung", state: "eating", order_status: "served", patience_ticks_left: 2800, eat_ticks_left: 300, reserved: {} },
        ],
        meta: screen === "quan"
          ? { bounds: { x: [0, 16], z: [0, 10] }, interact_radius: 1.5, patience_s: 60 }
          : screen === "shop"
            ? { max_ticks: 600, upgrades: DEFAULT_SHOP_UPGRADES }
            : { bounds: { x: [0, 100], d: [0, 30] }, dock_pos: [2, 0], dock_radius: 3, interact_radius: 2, catch_radius: 2, monsters: { species: { ca_sau: { detect_radius: 10, depths: [10, 30] } } } },
        events: [],
        finished: false,
        reason: null,
        error: null,
        presentation: {
          screen: screen === "pause" ? "gather" : screen,
          day_result: { served: 5, left: 1, shift_earned: 420, tip: 62, reputation_delta: 0.3 },
          summary: { money: 460, earned: 1260, score: 1660, reputation: 4.2, top_dishes: ["lau_mam", "ca_keo_nuong"] },
        },
      };
      if (screen === "quan") base.player = { pos: [8, 5], vel: [0, 0] };
      return base;
    }

    // ---------- Giao tiếp backend (/input, /presentation, /restart) ----------
    const down = new Set();
    const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
    let queue = [], inflight = false, lastSent = "";

    function activePhase() {
      if (!snap) return "gather";
      return snap.phase || snap.mode || "gather";
    }
    function activeScreen() {
      if (exited) return "exited";
      if (!snap) return "loading";
      if (snap.presentation && snap.presentation.screen) return snap.presentation.screen;
      return activePhase();
    }
    function isGameplayScreen(scr) {
      return scr === "gather" || scr === "quan" || scr === "shop";
    }
    function currentInput() {
      const ph = activePhase();
      const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
      let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
      if (ph === "quan") dy = -dy;
      return {
        move: [dx, dy],
        interact: down.has("interact"),
        catch: down.has("catch"),
        pause: down.has("pause"),
        shop_done: down.has("shop_done"),
      };
    }
    function enqueueInput(obj) {
      if (demoScreen) return;
      queue.push(JSON.stringify(obj));
      flush();
    }
    function pushInput() {
      if (demoScreen) return;
      const s = JSON.stringify(currentInput());
      if (s === lastSent) return;
      lastSent = s;
      queue.push(s);
      flush();
    }
    async function flush() {
      if (inflight) return;
      inflight = true;
      while (queue.length) {
        const body = queue.shift();
        try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
        catch (_) { }
      }
      inflight = false;
    }
    function pulseButton(btn) {
      const cur = currentInput();
      enqueueInput({ ...cur, [btn]: true });
      enqueueInput({ ...cur, [btn]: false });
      lastSent = "";
    }
    function sendBuy(item) {
      if (demoScreen) return;
      enqueueInput({ buy: item });
    }
    async function sendPresentation(action) {
      if (demoScreen) {
        if (action === "menu") snap = buildDemoSnapshot("menu");
        else if (action === "advance") snap = buildDemoSnapshot("gather");
        return;
      }
      try {
        await fetch("/presentation", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action }),
        });
      } catch (_) { }
    }
    function restartGame() {
      exited = false;
      if (demoScreen) { snap = buildDemoSnapshot(demoScreen); return; }
      fetch("/restart", { method: "POST" }).catch(() => { });
      lastSent = "";
      down.clear();
      pushInput();
    }

    el("btn-restart").addEventListener("click", restartGame);
    el("btn-pause").addEventListener("click", () => {
      if (isGameplayScreen(activeScreen())) pulseButton("pause");
    });

    addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      const scr = activeScreen();
      if (scr === "day_intro" && !dayIntroSent && !e.repeat) {
        dayIntroSent = true;
        clearTimeout(dayIntroTimer);
        sendPresentation("advance");
        e.preventDefault();
        return;
      }
      if ((scr === "evening_intro" || scr === "day_result") && (k === "enter" || k === " " || k === "e") && !e.repeat) {
        sendPresentation("advance");
        e.preventDefault();
        return;
      }
      if (k === "escape" || k === "p") {
        if (!e.repeat && isGameplayScreen(scr)) { down.add("pause"); pushInput(); }
        e.preventDefault();
        return;
      }
      if (scr === "shop" && (k === "e" || k === "enter") && !e.repeat) {
        pulseButton("shop_done");
        e.preventDefault();
        return;
      }
      if (k === " " && e.target instanceof HTMLButtonElement) return;
      if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
      if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
      else if (k === "e") down.add("interact");
      else if (k === " ") { down.add("catch"); e.preventDefault(); }
      else if (k === "r") return restartGame();
      pushInput();
    });
    addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
      else if (k === "e") down.delete("interact");
      else if (k === " ") down.delete("catch");
      else if (k === "escape" || k === "p") down.delete("pause");
      else if (k === "enter") down.delete("shop_done");
      pushInput();
    });
    addEventListener("blur", () => { down.clear(); pushInput(); });

    // ---------- Poll /state ----------
    async function poll() {
      if (demoScreen) { snap = buildDemoSnapshot(demoScreen); offline = false; return; }
      try {
        const r = await fetch("/state", { cache: "no-store" });
        snap = await r.json();
        offline = false;
      } catch (_) { offline = true; }
      setTimeout(poll, 16);
    }
    poll();

    // ---------- Helpers DOM & HUD ----------
    function setHtml(id, html) {
      if (rendered.get(id) === html) return;
      el(id).innerHTML = html;
      rendered.set(id, html);
    }
    function setText(id, text) {
      if (el(id).textContent !== text) el(id).textContent = text;
    }
    function statCard(label, value, extra = "", cls = "") {
      return `<div class="stat ${cls}"><span>${label}</span><strong>${value}</strong>${extra}</div>`;
    }
    function ingredientList(entries, empty) {
      if (!entries.length) return `<p class="muted">${empty}</p>`;
      return `<ul class="ingredients">${entries.map(([k, cnt]) => {
        const it = ingredient(k);
        return `<li><i class="ingredient-dot" style="--item:${it.color}"></i>${esc(it.name)}<strong>×${cnt}</strong></li>`;
      }).join("")}</ul>`;
    }
    function countHold(hold) {
      const out = {};
      for (const item of hold || []) {
        const k = typeof item === "object" && item !== null ? item.kind : item;
        out[k] = (out[k] || 0) + 1;
      }
      return out;
    }
    function isMonsterNear(state) {
      const p = state.player;
      const monsters = state.monsters || [];
      if (!p || !monsters.length) return false;
      const speciesMap = state.meta?.monsters?.species || {};
      for (const m of monsters) {
        if (m.state === "chase") return true;
        const sp = speciesMap[m.kind] || { detect_radius: 10, depths: [10, 30] };
        const minD = (sp.depths && sp.depths[0] !== undefined) ? sp.depths[0] : 10;
        const dist = Math.hypot(p.pos[0] - m.pos[0], p.pos[1] - m.pos[1]);
        if (p.pos[1] >= minD && dist <= (sp.detect_radius || 10)) return true;
      }
      return false;
    }
    function gatherProximityHint(state) {
      const p = state.player, meta = state.meta || {};
      if (!p) return "";
      const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
      if (Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr) return "Nhấn E để cập bến giao hàng";
      if (p.at_surface) {
        const r = meta.interact_radius || 2;
        const nearNode = (state.nodes || []).find((n) => n.ready && Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]) <= r);
        if (nearNode) return `Nhấn E để hái ${ingredient(nearNode.kind).name.toLowerCase()}`;
      }
      return "";
    }

    function renderGatherHud(state) {
      const p = state.player || { pos: [0, 0], oxygen_ticks: 0, oxygen_max_ticks: 1800, hp: 3, hp_max: 3, catch_cd_ticks: 0 };
      const oxyMax = p.oxygen_max_ticks || 1800;
      const oxyRatio = p.oxygen_ticks / oxyMax;
      const oxyLow = oxyRatio < 0.25;
      const oxyZero = p.oxygen_ticks <= 0;
      const timeLow = (state.time_left_ticks || 0) <= 1800;
      const hearts = "♥".repeat(p.hp || 0) + "♡".repeat(Math.max(0, (p.hp_max || 3) - (p.hp || 0)));

      setHtml("stats",
        statCard("Thời gian", fmtTime(state.time_left_ticks), "", timeLow ? "danger" : "") +
        statCard("Oxy", `${Math.ceil(p.oxygen_ticks / 60)}s`, `<meter max="${oxyMax}" value="${p.oxygen_ticks}"></meter>`, oxyLow ? "danger blink" : "") +
        statCard("Máu", `<span class="hearts">${hearts}</span>`) +
        statCard("Độ sâu", `${p.pos[1].toFixed(1)} m`) +
        statCard("Hồi bắt", p.catch_cd_ticks > 0 ? `${(p.catch_cd_ticks / 60).toFixed(1)}s` : "Sẵn sàng")
      );

      const counts = countHold(state.hold);
      const cap = state.hold_capacity || 12;
      const slots = Array.from({ length: cap }, (_, i) => {
        const item = (state.hold || [])[i];
        if (!item) return '<i class="slot"></i>';
        const isObj = typeof item === "object" && item !== null;
        const k = isObj ? item.kind : item;
        const fresh = isObj && item.fresh !== undefined ? Number(item.fresh) : null;
        const spoiled = fresh !== null && fresh < 30;
        const title = isObj ? `${item.id}: ${ingredient(k).name} (${fresh.toFixed(1)}%)${spoiled ? " [ƯƠN]" : ""}` : ingredient(k).name;
        return `<i class="slot full ${spoiled ? "spoiled-item" : ""}" style="--item:${ingredient(k).color}" title="${esc(title)}"></i>`;
      }).join("");

      let holdDetailsHtml = "";
      if (Array.isArray(state.hold) && state.hold.length > 0 && typeof state.hold[0] === "object") {
        const rows = state.hold.map(it => {
          const itInfo = ingredient(it.kind);
          const fresh = Number(it.fresh ?? 100);
          const isSpoiled = fresh < 30;
          return `<li><i class="ingredient-dot" style="--item:${itInfo.color}"></i>${esc(itInfo.name)} <small>(${esc(it.id)})</small><strong class="${isSpoiled ? "spoiled-badge" : "fresh-tag"}">${isSpoiled ? "ƯƠN (" + fresh.toFixed(1) + "%)" : fresh.toFixed(1) + "%"}</strong></li>`;
        }).join("");
        holdDetailsHtml = `<ul class="ingredients">${rows}</ul>`;
      } else {
        holdDetailsHtml = ingredientList(Object.entries(counts), "Giỏ đang trống.");
      }

      let planHtml = "";
      if (state.day_plan && state.day_plan.ingredients) {
        const rows = Object.entries(state.day_plan.ingredients).map(([k, need]) => {
          const got = counts[k] || 0;
          const cls = got >= need ? "done-item" : "";
          const it = ingredient(k);
          return `<li class="${cls}"><i class="ingredient-dot" style="--item:${it.color}"></i>${esc(it.name)}<strong>${got}/${need}</strong></li>`;
        }).join("");
        planHtml = `<div class="section-title">Kế hoạch Ngày ${state.day || 1}</div><ul class="ingredients">${rows}</ul>`;
      }

      setHtml("panel", `
    <div class="panel-title"><h2>Giỏ lưới</h2><span class="count">${state.hold_count || (state.hold ? state.hold.length : 0)}/${cap}</span></div>
    <div class="slots">${slots}</div>
    ${holdDetailsHtml}
    ${planHtml}
  `);

      const monsterDanger = isMonsterNear(state);
      el("scene").classList.toggle("monster-alert", monsterDanger);
      el("badge-monster").hidden = !monsterDanger;
      el("badge-oxy").hidden = !oxyZero;

      const hint = gatherProximityHint(state);
      el("prompt-hint").hidden = !hint;
      if (hint) setText("prompt-hint", hint);
    }

    function renderQuanHud(state) {
      const timeLow = (state.time_left_ticks || 0) <= 1800;
      const shiftEarned = state.shift_earned ?? state.money ?? 0;
      setHtml("stats",
        statCard("Thời gian", fmtTime(state.time_left_ticks), "", timeLow ? "danger" : "") +
        statCard("Tiền ca", `${shiftEarned}k`) +
        statCard("Số dư", `${state.money || 0}k`) +
        statCard("Uy tín", (state.reputation ?? 0).toFixed(1)) +
        statCard("Điểm", `${state.score || 0}`)
      );

      const patMax = ((state.meta && state.meta.patience_s) || 60) * 60;
      const available = {};
      let stockDetailsHtml = "";

      if (Array.isArray(state.stock)) {
        const reservedSet = new Set();
        for (const c of state.customers || []) {
          if (Array.isArray(c.reserved)) {
            for (const rId of c.reserved) reservedSet.add(rId);
          } else if (c.reserved && typeof c.reserved === "object") {
            // backward compat
          }
        }
        for (const it of state.stock) {
          const fresh = Number(it.fresh ?? 100);
          const isSpoiled = fresh < 30;
          const isRes = reservedSet.has(it.id);
          if (!isSpoiled && !isRes) {
            available[it.kind] = (available[it.kind] || 0) + 1;
          }
        }
        const rows = state.stock.map(it => {
          const itInfo = ingredient(it.kind);
          const fresh = Number(it.fresh ?? 100);
          const isSpoiled = fresh < 30;
          const isRes = reservedSet.has(it.id);
          const tag = isSpoiled ? "ƯƠN" : (isRes ? "GIỮ CHỖ" : "SẴN SÀNG");
          const tagCls = isSpoiled ? "spoiled-badge" : (isRes ? "count" : "fresh-tag");
          return `<li><i class="ingredient-dot" style="--item:${itInfo.color}"></i>${esc(itInfo.name)} <small>(${esc(it.id)})</small><strong class="${tagCls}">${tag} (${fresh.toFixed(1)}%)</strong></li>`;
        }).join("");
        stockDetailsHtml = `<div class="section-title">Chi tiết kho (${state.stock.length})</div><ul class="ingredients">${rows || "<li>Kho rỗng</li>"}</ul>`;
      } else {
        const stockMap = { ...(state.stock || {}) };
        for (const c of state.customers || []) {
          for (const [k, amt] of Object.entries(c.reserved || {})) {
            stockMap[k] = (stockMap[k] || 0) - amt;
          }
        }
        Object.assign(available, stockMap);
      }

      const byTable = new Map((state.customers || []).map((c) => [c.table_id, c]));
      const tableRows = (state.tables || []).map((tb) => {
        const c = byTable.get(tb.id);
        if (!c) return `<div class="detail"><small>Bàn ${esc(tb.id)}</small><strong>Trống</strong></div>`;
        const left = c.patience_ticks_left ?? patMax;
        const low = c.state === "waiting" && (left / patMax) < 0.25;
        const status = c.state === "eating" ? "Đang ăn" : `Chờ ${fmtTime(left)}`;
        return `<div class="order ${low ? "low-patience" : ""}"><small>Bàn ${esc(tb.id)} · ${status}</small><strong>${esc(dishName(c.dish_id))}</strong></div>`;
      }).join("");

      const stoveRows = (state.stoves || []).map((st) => {
        const dish = st.dish ? ` · ${esc(dishName(st.dish.dish_id))}` : "";
        const timer = st.state === "cooking" ? ` (${fmtTime(st.cook_ticks_left)})` : "";
        return `<div class="detail"><small>Bếp ${esc(st.id)}</small><strong>${STOVE_STATES[st.state] || st.state}${dish}${timer}</strong></div>`;
      }).join("");

      setHtml("panel", `
    <h2>Phục vụ quán</h2>
    ${tableRows || '<p class="muted">Chưa có bàn.</p>'}
    <div class="section-title">Bếp &amp; trên tay</div>
    ${stoveRows}
    <div class="detail"><small>Trên tay</small><strong>${state.hand ? esc(dishName(state.hand.dish_id)) : "Tay trống"}</strong></div>
    <div class="section-title">Kho khả dụng</div>
    ${ingredientList(Object.entries(available).filter(([, n]) => n > 0), "Kho khả dụng đang trống.")}
    ${stockDetailsHtml}
  `);

      el("scene").classList.remove("monster-alert");
      el("badge-monster").hidden = true;
      el("badge-oxy").hidden = true;
      el("prompt-hint").hidden = true;
    }

    function renderShopHud(state) {

      if (scr === "day_result") {

        const repSign = dr.reputation_delta >= 0 ? "+" : "";
        ov.hidden = false;
        setHtml("overlay-card", `

        const upgradesCfg = state.meta?.upgrades || DEFAULT_SHOP_UPGRADES;

        const active = state.active_upgrades || {};
        const money = state.money || 0;

        function shopRow(id, title, cfgList, descFn) {
          const lvl = bought[id] || 0;
          const actLvl = active[id] || 0;
          const next = cfgList.find((x) => x.level === lvl + 1);
          const activeNote = lvl > actLvl ? ` (đang áp cấp ${actLvl}, hiệu lực Ngày sau)` : "";
          if (!next) {
            return `<div class="shop-item"><div><strong>${title} · Cấp ${lvl} (Tối đa)</strong><small>Đã đạt cấp tối đa${activeNote}</small></div><button type="button" disabled>Đã tối đa</button></div>`;
          }
          const canBuy = money >= next.price;
          return `<div class="shop-item"><div><strong>${title} · Cấp ${lvl} → ${next.level}</strong><small>${descFn(next)} · Giá ${next.price}k${activeNote}</small></div><button class="primary" type="button" data-buy="${id}" ${canBuy ? "" : "disabled"}>Mua (${next.price}k)</button></div>`;
        }

        ov.hidden = false;
        setHtml("overlay-card", `
      <h2>Cửa hàng nâng cấp · Ngày ${state.day || 1}</h2>
      <p>Số dư hiện có: <strong>${money}k</strong> · Tự đóng sau <strong>${fmtTime(state.time_left_ticks)}</strong></p>
      <div class="shop-grid">
        ${shopRow("oxygen", "Bình oxy", upgradesCfg.oxygen || DEFAULT_SHOP_UPGRADES.oxygen, (n) => `Tối đa ${n.oxygen_max_s}s oxy`)}
        ${shopRow("hp", "Áo phao (Máu)", upgradesCfg.hp || DEFAULT_SHOP_UPGRADES.hp, (n) => `Tối đa ${n.hp_max} Máu`)}
      </div>
      <div class="card-actions">
        <button class="primary" type="button" data-act="shop-done">Đóng cửa hàng (E)</button>
      </div>
    `);
        return;
      }

      if (scr === "summary") {
        const sm = state.presentation?.summary || { money: state.money, earned: state.earned, score: state.score, reputation: state.reputation, top_dishes: [] };
        const topText = (sm.top_dishes && sm.top_dishes.length) ? sm.top_dishes.map(dishName).join(", ") : "Chưa có";
        ov.hidden = false;
        setHtml("overlay-card", `
      <h2>Tổng kết hành trình Chợ Nổi</h2>
      <ul class="kv-list">
        <li><span>Số dư cuối kỳ</span><strong>${sm.money || 0}k</strong></li>
        <li><span>Tổng doanh thu</span><strong>${sm.earned || 0}k</strong></li>
        <li><span>Uy tín</span><strong>${(sm.reputation ?? 0).toFixed(1)}</strong></li>
        <li><span>Tổng điểm</span><strong>${sm.score || 0}</strong></li>
        <li><span>Món bán chạy nhất</span><strong>${esc(topText)}</strong></li>
      </ul>
      <div class="card-actions">
        <button class="primary" type="button" data-act="restart">Chơi lại</button>
        <button type="button" data-act="menu">Về menu</button>
      </div>
    `);
        return;
      }

      if (state.finished) {
        ov.hidden = false;
        setHtml("overlay-card", `
      <h2>${esc(END_REASONS[state.reason] || "Lượt chơi kết thúc")}</h2>
      <p>Doanh thu: <strong>${state.earned || 0}k</strong> · Uy tín: <strong>${(state.reputation ?? 0).toFixed(1)}</strong> · Điểm: <strong>${state.score || 0}</strong></p>
      <div class="card-actions"><button class="primary" type="button" data-act="restart">Chơi lại</button></div>
    `);
        return;
      }

      ov.hidden = true;
    }

    el("overlay-card").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const buy = btn.dataset.buy;
      if (buy) { sendBuy(buy); return; }
      const act = btn.dataset.act;
      if (act === "advance") { dayIntroSent = true; clearTimeout(dayIntroTimer); sendPresentation("advance"); }
      else if (act === "menu") { exited = false; sendPresentation("menu"); }
      else if (act === "resume") pulseButton("pause");
      else if (act === "shop-done") pulseButton("shop_done");
      else if (act === "restart") restartGame();
      else if (act === "exit") { exited = true; sendPresentation("menu"); }
      else if (act === "back-menu") { exited = false; }
    });

    function eventLabel({ name, data }) {
      switch (name) {
        case "gather": return `Hái ${ingredient(data.kind).name.toLowerCase()} ×${data.amount}`;
        case "fish_caught": return `Bắt ${ingredient(data.kind).name.toLowerCase()} ×${data.yield}`;
        case "hold_full": return `Giỏ còn ${data.free} ô, cần ${data.required} ô`;
        case "oxygen_empty": return "Hết hơi! Bơi lên mặt nước!";
        case "choke": return `Đang ngạt! Còn ${data.hp} Máu`;
        case "monster_hit": return `Cá Sấu tấn công! Còn ${data.hp} Máu`;
        case "no_dish": return "Kho chưa đủ nguyên liệu cho món trong kế hoạch.";
        case "dish_ready": return `${dishName(data.dish_id)} đã chín!`;
        case "paid": return `Thu ${data.amount}k${data.tip ? ` (boa ${data.tip}k)` : ""}`;
        case "customer_left": return data.reason === "patience" ? "Khách rời bàn vì đợi lâu!" : "";
        case "bought": return `Đã mua ${data.upgrade} cấp ${data.level} (-${data.price}k)`;
        case "buy_failed": return `Mua thất bại (${data.reason})`;
        default: return "";
      }
    }

    function updateUi() {
      const notice = el("notice");
      if (!snap || offline || snap.error) {
        notice.hidden = false;
        setText("notice", snap?.error ? "Lượt chơi gặp lỗi — nhấn R để chơi lại." : offline ? "Mất kết nối máy chủ." : "Đang kết nối…");
      } else {
        const msg = [...(snap.events || [])].reverse().find((ev) => (snap.tick - ev.tick) <= 220 && eventLabel(ev));
        notice.hidden = !msg;
        if (msg) setText("notice", eventLabel(msg));
      }
      if (!snap) return;

      const ph = activePhase();
      const scr = activeScreen();
      document.body.classList.toggle("quan", ph === "quan");
      document.body.classList.toggle("shop", ph === "shop");
      const dayTag = snap.day ? `Ngày ${snap.day} · ` : "";
      setText("phase-pill", dayTag + (ph === "quan" ? "Buổi tối" : ph === "shop" ? "Cửa hàng" : "Buổi sáng"));
      setText("location", ph === "quan" ? "Nhà bè Má Tư" : ph === "shop" ? "Chợ Nổi Rạch Sen" : "Sông Chín Khúc");
      setText("action-label", ph === "quan" ? "Tương tác bếp / bàn" : ph === "shop" ? "Đóng cửa hàng" : "Hái / cập bến");
      el("catch-control").hidden = ph !== "gather";

      if (ph === "quan") renderQuanHud(snap);
      else if (ph === "shop") renderShopHud(snap);
      else renderGatherHud(snap);
      renderOverlay(scr, snap);
    }

    // ---------- Vẽ cảnh 2D phẳng ----------
    function fitCanvas() {
      const w = cv.clientWidth, h = cv.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return [w, h];
    }
    function rect(x, y, w, h, r, fill) {
      ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
    }
    function ellipse(x, y, rx, ry, fill) {
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
    }
    function poly(pts, fill) {
      ctx.beginPath(); ctx.moveTo(...pts[0]); for (const p of pts.slice(1)) ctx.lineTo(...p); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    }
    function seg(pts, color, w = 2) {
      ctx.beginPath(); ctx.moveTo(...pts[0]); for (const p of pts.slice(1)) ctx.lineTo(...p); ctx.lineWidth = w; ctx.strokeStyle = color; ctx.stroke();
    }
    function marker(text, x, y, bg = "#153632e8") {
      ctx.font = "700 18px system-ui, sans-serif";
      const tw = ctx.measureText(text).width + 14;
      rect(x - tw / 2, y - 20, tw, 24, 6, bg);
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = "#fff8df";
      ctx.fillText(text, x, y - 2);
    }
    function rangeRing(x, y, rx, ry, color = "#fff6cf88") {
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
    }

    function drawGatherScene(w, h) {
      const meta = snap.meta || {};
      const b = meta.bounds || { x: [0, 100], d: [0, 30] };
      const surface = h * 0.24, xPad = 28, depthH = h - surface - 22;
      const sx = (x) => xPad + x * (w - 2 * xPad) / b.x[1];
      const sy = (d) => surface + d * depthH / b.d[1];

      // Trời hồng buổi sớm & dừa nước
      const sky = ctx.createLinearGradient(0, 0, 0, surface);
      sky.addColorStop(0, "#d7e4c4"); sky.addColorStop(0.55, "#f6dfb0"); sky.addColorStop(1, "#f2b886");
      ctx.fillStyle = sky; ctx.fillRect(0, 0, w, surface);
      ellipse(w * 0.78, surface * 0.45, 36, 36, "#fff0bd");
      ctx.fillStyle = "#4d745f";
      ctx.fillRect(0, surface - 14, w, 14);

      // Nước phù sa chuyển sâu
      const water = ctx.createLinearGradient(0, surface, 0, h);
      water.addColorStop(0, "#689e82"); water.addColorStop(0.33, "#3c776b");
      water.addColorStop(0.66, "#235254"); water.addColorStop(1, "#122f37");
      ctx.fillStyle = water; ctx.fillRect(0, surface, w, h - surface);
      seg([[0, sy(10)], [w, sy(10)]], "#ffffff26", 1);
      seg([[0, sy(20)], [w, sy(20)]], "#ffffff26", 1);

      // Bến
      const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
      const dx = sx(dp[0]), dy = sy(dp[1]);
      rect(dx - 18, dy - 18, 36, 16, 2, "#d8a468");
      poly([[dx - 24, dy - 18], [dx, dy - 36], [dx + 24, dy - 18]], "#9a5440");
      rangeRing(dx, dy, sx(dr) - sx(0), sy(dr) - sy(0), "#ffe6a0a0");
      marker("Bến", Math.max(38, dx), dy + 32);

      // Nút hái (6 nút)
      for (const n of snap.nodes || []) {
        const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
        ctx.save(); ctx.globalAlpha = n.ready ? 1 : 0.4;
        ellipse(nx, ny, 12, 4, "#3b6b4b");
        ellipse(nx, ny - 8, 7, 7, ingredient(n.kind).color);
        ctx.restore();
        if (!n.ready) marker(fmtTime(n.regrow_ticks), nx, ny + 26);
      }

      // Đàn cá (3 loài)
      for (const f of snap.fish || []) {
        ctx.save();
        ctx.translate(sx(f.pos[0]), sy(f.pos[1]));
        ctx.rotate((f.heading_deg || 0) * Math.PI / 180);
        const col = ingredient(f.kind).color;
        poly([[-12, 0], [-19, -5], [-19, 5]], col);
        ellipse(0, 0, 12, 6, col);
        ellipse(5, -1, 2, 2, "#192b2c");
        ctx.restore();
      }

      // Cá Sấu Năm Chèo (M1 / M2)
      for (const m of snap.monsters || []) {
        const mx = sx(m.pos[0]), my = sy(m.pos[1]);
        ctx.save();
        ctx.globalAlpha = m.state === "recoil" ? 0.6 : 1;
        const bodyCol = m.state === "chase" ? "#8e24aa" : "#3a5f3c";
        ellipse(mx, my, 22, 9, bodyCol);
        poly([[mx - 20, my], [mx - 32, my - 6], [mx - 32, my + 6]], bodyCol);
        ellipse(mx + 14, my - 3, 3, 3, "#ffeb3b");
        ctx.restore();
        marker(m.id, mx, my - 14, m.state === "chase" ? "#6a1b9af0" : "#254429e8");
      }

      // Út Sen
      const p = snap.player;
      if (p) {
        const px = sx(p.pos[0]), py = sy(p.pos[1]);
        const r = p.at_surface ? (meta.interact_radius || 2) : (meta.catch_radius || 2);
        rangeRing(px, py, sx(r) - sx(0), sy(r) - sy(0));
        if (!(p.invuln_ticks > 0 && Math.floor((snap.tick || 0) / 5) % 2)) {
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate((p.heading_deg || 0) * Math.PI / 180);
          ellipse(-5, 0, 12, 6, "#e3864c");
          ellipse(5, 0, 6, 6, "#f2c18a");
          ellipse(7, -1, 4, 3, "#26645c");
          ctx.restore();
        }
      }
    }

    function drawQuanScene(w, h) {
      const meta = snap.meta || {};
      const b = meta.bounds || { x: [0, 16], z: [0, 10] };
      const pad = 28, top = 40;
      const u = Math.min((w - pad * 2) / b.x[1], (h - top - 24) / b.z[1]);
      const rw = b.x[1] * u, rh = b.z[1] * u;
      const ox = (w - rw) / 2, oy = top + (h - top - 24 - rh) / 2;
      const sx = (x) => ox + x * u, sy = (z) => oy + rh - z * u;

      // Nước đêm & nhà bè gỗ nâu
      ctx.fillStyle = "#15363d"; ctx.fillRect(0, 0, w, h);
      rect(ox - 8, oy - 8, rw + 16, rh + 16, 12, "#6c4830");
      rect(ox, oy, rw, rh, 8, "#be8f5e");
      for (let i = 1; i <= 8; i++) {
        ellipse(ox + rw * i / 9, oy + 6, 7, 7, "#ffdf8c");
      }

      // 2 Bếp
      for (const st of snap.stoves || []) {
        const x = sx(st.pos[0]), y = sy(st.pos[1]);
        rect(x - u * 0.72, y - u * 0.55, u * 1.44, u * 1.1, 8, "#6a4a35");
        ellipse(x, y, u * 0.42, u * 0.28, st.state === "cooking" ? "#e07a38" : st.state === "ready" ? "#77b55a" : "#5e574e");
        marker(st.id, x, y + u * 0.95);
      }

      // 4 Bàn & khách
      const patMax = (meta.patience_s || 60) * 60;
      const byTable = new Map((snap.customers || []).map((c) => [c.table_id, c]));
      for (const tb of snap.tables || []) {
        const x = sx(tb.pos[0]), y = sy(tb.pos[1]);
        ellipse(x, y, u * 0.72, u * 0.5, "#9c433a");
        marker(tb.id, x, y + u * 0.95);
        const c = byTable.get(tb.id);
        if (c) {
          ellipse(x, y - u * 0.85, u * 0.36, u * 0.36, c.state === "eating" ? "#74b86a" : "#e8b48c");
          if (c.state === "waiting") {
            const ratio = Math.max(0, Math.min(1, (c.patience_ticks_left ?? patMax) / patMax));
            rect(x - u * 0.55, y - u * 1.42, u * 1.1, 7, 3, "#3b2820");
            rect(x - u * 0.55, y - u * 1.42, u * 1.1 * ratio, 7, 3, ratio < 0.25 ? "#e53935" : "#ffd54f");
          }
        }
      }

      // Út Sen
      const p = snap.player;
      if (p) {
        const px = sx(p.pos[0]), py = sy(p.pos[1]);
        rangeRing(px, py, (meta.interact_radius || 1.5) * u, (meta.interact_radius || 1.5) * u);
        ellipse(px, py, u * 0.42, u * 0.42, "#e5894f");
        ellipse(px, py - u * 0.16, u * 0.22, u * 0.22, "#f2c18a");
        if (snap.hand) ellipse(px + u * 0.36, py + u * 0.18, u * 0.22, u * 0.14, "#fff2c6");
      }
    }

    // ---------- Vòng lặp render + đo FPS ----------
    let fpsFrames = 0, fpsLast = performance.now(), fpsAvg = 60;
    window.__chonoiFps = 60;
    function frame(now) {
      requestAnimationFrame(frame);
      fpsFrames += 1;
      if (now - fpsLast >= 1000) {
        fpsAvg = Math.round(fpsFrames * 1000 / (now - fpsLast));
        window.__chonoiFps = fpsAvg;
        setText("fps-tag", `${fpsAvg} FPS`);
        fpsFrames = 0;
        fpsLast = now;
      }
      const [w, h] = fitCanvas();
      updateUi();
      if (!snap) return;
      if (activePhase() === "quan") drawQuanScene(w, h);
      else drawGatherScene(w, h);
    }
    requestAnimationFrame(frame);
  </script>
</body>
